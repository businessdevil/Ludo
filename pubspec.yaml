name: neo_ludo
description: Offline Ludo for Android (Flutter).
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
flutter_native_splash:
  color: "#E9CFA0"
  image: assets/icon.png
  android_12:
    color: "#E9CFA0"
    image: assets/icon.png
